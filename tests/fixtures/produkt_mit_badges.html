<html lang="de"><head>
<meta property="og:title" content="Homeworlds Spotlight Deck - Chewbacca"/>
<meta property="og:image" content="https://www.twomoons.ch/media/9b/a3/ab/1788255962/Chewbacca2EN.webp?ts=1788255962"/>
<meta itemprop="priceCurrency" content="CHF"/>
<title>Homeworlds Spotlight Deck - Chewbacca | TwoMoons</title>
</head><body>

<nav aria-label="breadcrumb">
  <ol class="breadcrumb" itemscope itemtype="https://schema.org/BreadcrumbList">
    <li class="breadcrumb-item home-link"><a class="breadcrumb-link" href="/"><span class="breadcrumb-title" itemprop="name">Home</span></a></li>
    <li aria-hidden="true" class="breadcrumb-placeholder"><span class="icon icon-arrow-medium-right"></span></li>

    <li aria-hidden="true" class="breadcrumb-placeholder"><span class="icon icon-arrow-medium-right"></span></li>
    <li class="breadcrumb-item"><a class="breadcrumb-link is-active" href="https://www.twomoons.ch/star-wars/"><span class="breadcrumb-title" itemprop="name">Star Wars: Unlimited</span></a></li>
  </ol>
</nav>

<div class="row g-0">
<div class="cms-section-sidebar-main-content col-lg-8 col-xl-9">
<div class="cms-block bg-color pos-1 cms-block-zen-gallery-description-heading-buybox position-relative">
  <div class="cms-block-container"><div class="cms-block-container-row row cms-row">

    <div class="row g-2 product-detail-headline"><div class="col-12 product-heading-name-container"><div class="cms-element-product-name">
      <!-- @deprecated tag:v6.8.0 - Kommentare sind NavigableString und dürfen nicht als Text zählen -->
      <h1 class="product-detail-name" itemprop="name"><span class="subheadings">Star Wars Unlimited</span><br>
        Homeworlds Spotlight Deck - Chewbacca
        <br><span class="product-variant-characteristics-option subheadings">
          Chewbacca | Englisch
        </span></h1>
    </div></div></div>

    <div class="product-detail-price-container">
      <meta content="24.9" itemprop="price"/>
      <span class="visually-hidden product-detail-price-label">Regulärer Preis:</span>
      <p class="product-detail-price">CHF 24.90</p>
    </div>

    <div class="product-detail-delivery-information"><div class="product-delivery-information">
      <link href="https://schema.org/InStock" itemprop="availability"/>
      <p class="delivery-information delivery-preorder"><span class="delivery-status-indicator bg-warning"></span>
        Vorbestellung
      </p>
    </div></div>

    <div class="product-detail-buy js-magnifier-zoom-image-container">
      <form class="buy-widget"><button class="btn btn-primary btn-buy">In den Warenkorb</button></form>
    </div>

  </div></div>
</div>

<!-- Empfehlungs-Slider: gleiche Klassen wie die Produktkarten, aber FREMDE Produkte.
     Ihre Badges und Sprachflaggen dürfen nie im Embed landen. -->
<div class="cms-block cms-block-product-slider">
  <div class="twomoons-slider"><div class="twomoons-slider-wrapper-scroll">
    <div class="slider-item"><div class="card product-box box-standard"><div class="card-body">
      <div class="product-badges"><span class="badge bg-info">Vorbestellung</span><span class="badge bg-success badge-new">Neu</span></div>
      <div class="product-image-wrapper is-standard"><span class="twomoons-language-badges">
        <img alt="Französisch" class="twomoons-language-badge" src="/bundles/languages/french.png" title="Französisch"/></span></div>
      <a class="product-name" href="https://www.twomoons.ch/ein-ganz-anderes-produkt">Ein ganz anderes Produkt</a>
    </div></div></div>
  </div></div>
</div>
</div></div>

<div class="cms-element-product-description-reviews">
  <div class="product-detail-properties tab-pane-container"><div class="product-detail-properties">
    <table class="table table-striped product-detail-properties-table"><tbody>
      <tr class="properties-row"><th class="properties-label">Min. Anzahl Spieler:</th><td class="properties-value"><span>2</span></td></tr>
      <tr class="properties-row"><th class="properties-label">Sprache:</th><td class="properties-value"><span>Englisch</span></td></tr>
      <tr class="properties-row"><th class="properties-label">Grösse:</th><td class="properties-value"><span>50 Cards</span></td></tr>
    </tbody></table>
  </div></div>
  <div class="product-detail-review">
    <div class="product-review-point"><div class="point-rating point-blank"><span class="icon icon-star"></span></div></div>
  </div>
</div>
