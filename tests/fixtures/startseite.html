<!DOCTYPE html>
<!-- Startseite mit mehreren Produkt-Slidern. Nur einer ist "Neu im Shop". -->
<html lang="de"><body>
<div class="cms-block cms-block-image-text"><h2>Willkommen bei TwoMoons</h2><p>Kein Slider.</p></div>

<div class="cms-block cms-block-product-slider">
  <h3 class="base-slider-controls-title">Bestseller</h3>
  <div class="twomoons-slider"><div class="slider-item">
    <div class="card product-box box-standard"><div class="card-body">
      <a class="product-name" href="https://www.twomoons.ch/ein-bestseller">Ein Bestseller</a>
    </div></div>
  </div></div>
</div>

<div class="cms-block cms-block-product-slider">
  <h3 class="base-slider-controls-title">Neu im Shop</h3>
  <div class="twomoons-slider"><div class="twomoons-slider-wrapper-scroll">
    <div class="slider-item"><div class="card product-box box-standard"><div class="card-body">
      <div class="product-badges"><span class="badge bg-success badge-new">Neu</span></div>
      <a class="product-image-link" href="https://www.twomoons.ch/armory-deck-malice-englisch"><img/></a>
      <a class="product-name" href="https://www.twomoons.ch/armory-deck-malice-englisch">Armory Deck Malice</a>
    </div></div></div>
    <div class="slider-item"><div class="card product-box box-standard"><div class="card-body">
      <div class="product-badges"><span class="badge bg-info">Vorbestellung</span></div>
      <a class="product-name" href="/disney-lorcana-hyperia-city-booster-display-booster-box-deutsch">Hyperia City Display</a>
    </div></div></div>
  </div></div>
</div>
</body></html>
